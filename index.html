<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYMAN InnoTech | Portfolio of Ayman Ullah</title>
    
    <!-- Primary SEO Meta Tags -->
    <meta name="description" content="Official Website of Ayman InnoTech. Explore Ayman Ullah's innovative technologies, blogs, and journals.">
    <meta name="keywords" content="Ayman, Ayman Ullah, AI, Ayman InnoTech, AIT, Ayman GitHub, Ayman Innovative Technologies">
    <meta name="author" content="Ayman Ullah">

    <!-- Social Preview (Open Graph) -->
    <meta property="og:title" content="AYMAN InnoTech | Ayman Ullah">
    <meta property="og:image" content="media/aymaninnotech@social-preview.png">
    <meta property="og:type" content="website">

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body oncontextmenu="return false;"> <!-- Basic No-Right-Click Protection -->

    <!-- Futuristic Neon Loader -->
    <div id="loader">
        <div class="loader-content">
            <h1 class="neon-text-logo">AI</h1>
            <div class="gradient-bar"></div>
            <p>Ayman's Innovative Technologies</p>
        </div>
    </div>

    <!-- Header (Sticky) -->
    <header id="main-header">
        <div class="nav-container">
            <div class="logo-group">
                <img src="media/aymaninnotech@logo.jpg" alt="AI Logo" class="nav-logo">
                <div class="brand-info">
                    <span class="brand-name">AYMAN InnoTech</span>
                    <small>Ayman's Innovative Technologies</small>
                </div>
            </div>
            
            <div class="search-box">
                <input type="text" placeholder="Search projects, blogs..." id="global-search">
                <i class="fas fa-search"></i>
            </div>

            <nav class="desktop-nav">
                <a href="#home">Home</a>
                <a href="#blogs">Blogs</a>
                <a href="#projects">Projects</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
            
            <button class="hamburger"><i class="fas fa-bars"></i></button>
        </div>
    </header>

    <!-- Content Sections -->
    <main id="content">
        <!-- Sections will be injected here via JS for SPA feel -->
    </main>

    <!-- Floating Accessibility & Tools -->
    <div class="floating-controls">
        <button id="accessibility-btn" class="float-btn 3d-effect" title="Accessibility">
            <i class="fas fa-universal-access"></i>
        </button>
        <button id="go-to-top" class="float-btn 3d-effect" title="Go to Top">
            <i class="fas fa-chevron-up"></i>
        </button>
    </div>

    <!-- Cookie Consent Toast -->
    <div id="cookie-toast" class="cookie-card">
        <p>We use cookies to enhance your futuristic experience.</p>
        <div class="cookie-btns">
            <button onclick="acceptCookies()">Accept All</button>
            <button onclick="hideCookies()">Necessary Only</button>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
